[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseqflow"
version = "0.1.0"
description = "A modular bulk RNA-seq workflow for non-model organisms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = {text = "MIT"}
authors = [{name="RNAseqFlow contributors"}]

[project.optional-dependencies]
workflow = ["snakemake>=8,<10"]
test = ["pytest>=8"]

[project.scripts]
rnaseqflow = "rnaseqflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnaseqflow = ["assets/**/*", "assets/**/**/*"]
